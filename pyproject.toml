[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbz-shelf"
dynamic = ["version"]
description = "A library and reader for .cbz comics and EPUB books: scan folders, edit metadata, search, read in the browser"
readme = "README.md"
requires-python = ">=3.10"
# cbz-webp provides the console server, natural sorting, path handling and Pillow.
dependencies = ["cbz-webp @ git+https://github.com/syahmizainudin/cbz-webp@v0.5.0"]

[project.scripts]
cbz-shelf = "cbzshelf.cli:main"

[tool.setuptools]
packages = ["cbzshelf"]

[tool.setuptools.package-data]
cbzshelf = ["ui.html"]

[tool.setuptools.dynamic]
version = { attr = "cbzshelf.__version__" }

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "UP", "RUF"]
ignore = [
  "RUF001",  # ambiguous unicode in strings: the "…" in messages is intended
]

[tool.ruff.lint.per-file-ignores]
"cbzshelf/library.py" = ["E501"]  # SQL reads better unwrapped
"tests/{helpers,test_epub}.py" = ["E501"]  # EPUB fixtures: XML and HTML in one string
